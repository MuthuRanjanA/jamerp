spring.application.name=EmployeeManagement
server.port=${PORT:8080}

# Import local .env file
spring.config.import=optional:file:.env[.properties]

# Database Configuration (Persistent H2 with PostgreSQL compatibility mode as fallback)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/erpdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.security.user.name=${ADMIN_EMAIL:admin@jam.com}
spring.security.user.password=${ADMIN_PASSWORD:1234}

# Application Secrets / Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://*.vercel.app,https://*.netlify.app,https://jamerpapplication.netlify.app,http://localhost:5173,http://localhost:3000,http://localhost:5174}
app.default-temp-password=${DEFAULT_TEMP_PASSWORD:TempPassword@123}

# Optional
spring.jpa.properties.hibernate.format_sql=true
